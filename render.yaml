# Render Blueprint: un servicio web (Docker) + PostgreSQL gestionado. En Render: New → Blueprint → elige este repositorio.
services:
  - type: web
    name: vertice
    runtime: docker
    plan: starter            # 'free' funciona para probar, pero se duerme tras 15 min sin tráfico
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: vertice-db, property: connectionString }
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: AMBIENT_NPCS
        value: "24"
databases:
  - name: vertice-db
    plan: basic-256mb
    databaseName: vertice
    user: vertice
