# PostgreSQL local para desarrollo. Alternativa sin Docker: deja DATABASE_URL vacío y se usará PGlite (./data/pglite).
services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: vertice
      POSTGRES_PASSWORD: vertice
      POSTGRES_DB: vertice
    ports: ["5432:5432"]
    volumes: ["vertice-pg:/var/lib/postgresql/data"]
volumes:
  vertice-pg: {}
