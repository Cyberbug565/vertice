name: Pruebas de Vértice
on:
  push:
    branches: [codex/ciudad-viva-025]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  juego:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --reporter=dot
      - run: npm run build -w client
