# Fly.io: fly launch --copy-config --no-deploy && fly postgres create && fly postgres attach <nombre> && fly deploy
app = "vertice"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TRUST_PROXY = "true"
  DATABASE_SSL = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # un mundo persistente no debe apagarse
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 600

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
